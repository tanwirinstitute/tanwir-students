[functions]
  directory = "netlify/functions"

# Proxy emailer calls through this origin so the browser never makes a
# cross-origin request to email.tanwir.institute (which sends no CORS headers).
# Must come before the SPA catch-all below (first match wins).
[[redirects]]
  from = "/emailer/*"
  to = "https://email.tanwir.institute/api/:splat"
  status = 200
  force = true

# Financial-aid approval relay (holds SYNC_API_TOKEN / MAIL_API_TOKEN server-side).
# Must come before the SPA catch-all below.
[[redirects]]
  from = "/api/approve-financial-aid"
  to = "/.netlify/functions/approve-financial-aid"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
